<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="32" height="32" rx="6.4" fill="#0F1923"/>

  <!-- H monogram: Arch with pillars -->
  <!-- Left pillar -->
  <rect x="7" y="10" width="2" height="14" fill="#C5A55A"/>

  <!-- Right pillar -->
  <rect x="23" y="10" width="2" height="14" fill="#C5A55A"/>

  <!-- Arch (curved top connecting pillars) -->
  <path d="M 9 10 Q 16 6 25 10" stroke="#C5A55A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Horizontal crossbar -->
  <rect x="7" y="17" width="18" height="2" fill="#C5A55A"/>

  <!-- Diamond accent above arch -->
  <path d="M 16 5 L 18 7 L 16 9 L 14 7 Z" fill="#C5A55A"/>
</svg>