<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Havn Stays - Facebook Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Inter', Arial, sans-serif;
        }

        .container {
            width: 820px;
            height: 312px;
            background: linear-gradient(135deg, #1A1611 0%, #1a2a3a 50%, #1A1611 100%);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 40px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Subtle decorative element */
        .accent-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #8B7548 0%, #8B7548 50%, transparent 100%);
        }

        .left-section {
            flex: 1;
            z-index: 2;
        }

        .brand-name {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 56px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        .brand-haven {
            color: #FFFFFF;
        }

        .brand-stays {
            color: #8B7548;
        }

        .subtitle {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #B0B0B0;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .right-section {
            text-align: right;
            z-index: 2;
        }

        .tagline {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 24px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .tagline-sub {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 12px;
            color: #8B7548;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Decorative gold line separator */
        .separator {
            position: absolute;
            right: 35%;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 120px;
            background: rgba(197, 165, 90, 0.3);
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="brand-name">
                <span class="brand-haven">HAVN</span>
                <span class="brand-stays"> STAYS</span>
            </div>
            <div class="subtitle">By Medini Homes</div>
        </div>

        <div class="separator"></div>

        <div class="right-section">
            <div class="tagline">Premium Villa<br>Management</div>
            <div class="tagline-sub">MARRAKECH</div>
        </div>

        <div class="accent-bar"></div>
    </div>
</body>
</html>
