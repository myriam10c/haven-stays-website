<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Haven Stays Logo — Light variant (for dark backgrounds) -->

  <!-- Monogram icon: stylized "H" with arch motif -->
  <g transform="translate(0,10)">
    <rect x="12" y="28" width="4" height="62" rx="2" fill="#FFFFFF"/>
    <rect x="52" y="28" width="4" height="62" rx="2" fill="#FFFFFF"/>
    <path d="M14 48 C14 28, 54 28, 54 48" stroke="#C5A55A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="16" y="56" width="36" height="2.5" rx="1.25" fill="#C5A55A"/>
    <path d="M34 22 L37.5 26 L34 30 L30.5 26 Z" fill="#C5A55A"/>
  </g>

  <!-- Wordmark: HAVEN -->
  <text x="80" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="400" letter-spacing="0.22em" fill="#FFFFFF">HAVEN</text>

  <!-- Wordmark: STAYS (italic, gold) -->
  <text x="236" y="52" font-family="'Cormorant Garamond', Georgia, serif" font-size="38" font-weight="400" font-style="italic" letter-spacing="0.22em" fill="#C5A55A">STAYS</text>

  <!-- Tagline -->
  <text x="80" y="72" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="500" letter-spacing="0.35em" fill="rgba(255,255,255,0.35)">BY MEDINI HOMES</text>

  <!-- Separator line -->
  <line x1="80" y1="80" x2="380" y2="80" stroke="#C5A55A" stroke-width="0.5" opacity="0.2"/>

  <!-- Descriptor -->
  <text x="80" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="300" letter-spacing="0.18em" fill="rgba(255,255,255,0.35)">PREMIUM VILLA MANAGEMENT · MARRAKECH</text>
</svg>