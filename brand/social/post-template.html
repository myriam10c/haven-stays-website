<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Havn Stays - Post Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Inter', Arial, sans-serif;
        }

        .container {
            width: 1080px;
            height: 1080px;
            display: flex;
            flex-direction: column;
            background: #FFFFFF;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* Gold accent bar at top */
        .accent-bar-top {
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #C5A55A 0%, #C5A55A 100%);
        }

        /* Content area */
        .content-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F5F0EB 0%, #FFFFFF 100%);
            position: relative;
            overflow: hidden;
        }

        /* Hero image with overlay */
        .image-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dark overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 25, 35, 0.35);
            z-index: 1;
        }

        /* Content placeholder */
        .content-placeholder {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            color: #FFFFFF;
            text-align: center;
            padding: 40px;
        }

        .placeholder-text {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
            line-height: 1.3;
            max-width: 600px;
        }

        /* Footer section */
        .footer {
            background: #0F1923;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100px;
        }

        .footer-separator {
            flex: 1;
            height: 2px;
            background: #C5A55A;
            margin-right: 20px;
        }

        .brand-name {
            display: flex;
            align-items: baseline;
            gap: 3px;
            flex-shrink: 0;
        }

        .brand-name-haven {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: 1.5px;
        }

        .brand-name-stays {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            color: #C5A55A;
            letter-spacing: 1px;
        }

        .footer-accent {
            width: 8px;
            height: 8px;
            background: #C5A55A;
            border-radius: 50%;
            margin-left: 20px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="accent-bar-top"></div>

        <div class="content-area">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1622161692292-78e50512cb67?w=1080&h=1080&fit=crop" alt="Villa">
            </div>
            <div class="overlay"></div>
            <div class="content-placeholder">
                <div class="placeholder-text">Your Luxury Villa Awaits</div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-separator"></div>
            <div class="brand-name">
                <span class="brand-name-haven">HAVN</span>
                <span class="brand-name-stays">STAYS</span>
            </div>
            <div class="footer-accent"></div>
        </div>
    </div>
</body>
</html>
