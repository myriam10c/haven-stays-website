<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Havn Stays - Profile Picture</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Inter', Arial, sans-serif;
        }

        .container {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #0F1923 0%, #1a2535 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .monogram {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        .monogram-h {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Left pillar */
        .pillar {
            position: absolute;
            width: 16px;
            height: 100px;
            background: #FFFFFF;
            top: 10px;
        }

        .pillar-left {
            left: 25px;
        }

        .pillar-right {
            right: 25px;
        }

        /* Gold arch */
        .arch {
            position: absolute;
            width: 70px;
            height: 50px;
            border: 3px solid #C5A55A;
            border-bottom: none;
            border-radius: 50px 50px 0 0;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Gold crossbar */
        .crossbar {
            position: absolute;
            width: 70px;
            height: 3px;
            background: #C5A55A;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
        }

        /* Gold diamond accent */
        .diamond {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #C5A55A;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
        }

        .brand-text {
            text-align: center;
            margin-top: 10px;
        }

        .brand-haven {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #FFFFFF;
            line-height: 1;
        }

        .brand-stays {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #C5A55A;
            line-height: 1;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="monogram">
            <div class="monogram-h">
                <div class="pillar pillar-left"></div>
                <div class="pillar pillar-right"></div>
                <div class="arch"></div>
                <div class="crossbar"></div>
                <div class="diamond"></div>
            </div>
            <div class="brand-text">
                <div class="brand-haven">HAVN</div>
                <div class="brand-stays">STAYS</div>
            </div>
        </div>
    </div>
</body>
</html>
