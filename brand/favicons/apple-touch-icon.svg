<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="180" height="180" rx="36" fill="#0F1923"/>

  <!-- H monogram: Arch with pillars -->
  <!-- Left pillar -->
  <rect x="50" y="60" width="12" height="84" fill="#C5A55A"/>

  <!-- Right pillar -->
  <rect x="118" y="60" width="12" height="84" fill="#C5A55A"/>

  <!-- Arch (curved top connecting pillars) -->
  <path d="M 56 60 Q 90 36 134 60" stroke="#C5A55A" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- Horizontal crossbar -->
  <rect x="50" y="102" width="80" height="12" fill="#C5A55A"/>

  <!-- Diamond accent above arch -->
  <path d="M 90 30 L 102 42 L 90 54 L 78 42 Z" fill="#C5A55A"/>
</svg>