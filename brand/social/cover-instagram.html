<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Havn Stays - Instagram Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@400;500;300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Inter', Arial, sans-serif;
        }

        .container {
            width: 1080px;
            height: 1080px;
            background: linear-gradient(135deg, #1A1611 0%, #1a2a3a 50%, #1A1611 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
        }

        /* Subtle accent elements */
        .accent-top {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #8B7548 50%, transparent 100%);
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .brand-logo {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-haven {
            color: #FFFFFF;
        }

        .logo-stays {
            color: #8B7548;
        }

        .header-separator {
            width: 40px;
            height: 2px;
            background: #8B7548;
        }

        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .tagline {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 64px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.2;
            max-width: 900px;
            letter-spacing: 0.5px;
            font-style: italic;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .footer-separator {
            width: 40px;
            height: 2px;
            background: #8B7548;
        }

        .website {
            font-family: 'Inter', Arial, sans-serif;
            font-size: 18px;
            font-weight: 500;
            color: #8B7548;
            letter-spacing: 0.5px;
            text-transform: lowercase;
        }

        /* Corner accents */
        .corner-accent {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid #8B7548;
            opacity: 0.3;
        }

        .corner-top-left {
            top: 30px;
            left: 30px;
        }

        .corner-top-right {
            top: 30px;
            right: 30px;
        }

        .corner-bottom-left {
            bottom: 30px;
            left: 30px;
        }

        .corner-bottom-right {
            bottom: 30px;
            right: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="corner-accent corner-top-left"></div>
        <div class="corner-accent corner-top-right"></div>

        <div class="accent-top"></div>

        <div class="header">
            <div class="brand-logo">
                <span class="logo-haven">HAVN</span>
                <span class="logo-stays"> STAYS</span>
            </div>
            <div class="header-separator"></div>
        </div>

        <div class="main-content">
            <div class="tagline">L'art de la gestion locative d'exception.</div>
        </div>

        <div class="footer">
            <div class="footer-separator"></div>
            <div class="website">havenstays.com</div>
        </div>

        <div class="corner-accent corner-bottom-left"></div>
        <div class="corner-accent corner-bottom-right"></div>
    </div>
</body>
</html>
