<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="102.4" fill="#0F1923"/>

  <!-- H monogram: Arch with pillars -->
  <!-- Left pillar -->
  <rect x="160" y="170" width="40" height="280" fill="#C5A55A"/>

  <!-- Right pillar -->
  <rect x="312" y="170" width="40" height="280" fill="#C5A55A"/>

  <!-- Arch (curved top connecting pillars) -->
  <path d="M 180 170 Q 256 100 392 170" stroke="#C5A55A" stroke-width="40" fill="none" stroke-linecap="round"/>

  <!-- Horizontal crossbar -->
  <rect x="160" y="310" width="192" height="40" fill="#C5A55A"/>

  <!-- Diamond accent above arch -->
  <path d="M 256 80 L 280 104 L 256 128 L 232 104 Z" fill="#C5A55A"/>
</svg>